name: Publish HLCA 261 Logo PNGs

on:
  push:
    paths:
      - .github/workflows/publish-hlca.yml
      - sync_dropbox_logos.py
      - logo_manifest.csv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-hlca-logos
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image library
        run: python -m pip install --disable-pip-version-check pillow
      - name: Import and map all 261 logo PNGs
        run: python sync_dropbox_logos.py
      - name: Publish direct-link PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- logos/
          if git diff --cached --quiet; then
            echo "All 261 logos already match current published versions."
          else
            git commit -m "Publish 261 college team logo PNGs"
            git push origin HEAD:main
          fi
