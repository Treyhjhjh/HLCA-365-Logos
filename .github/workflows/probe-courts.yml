name: Probe public Hoop Land NCAA court images
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_courts.py
      - .github/workflows/probe-courts.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/probe_courts.py
